<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>AI Agency locations & Markets | ai20</title>
    <meta name="title" content="AI Agency locations & Markets | ai20">
    <meta name="description"
        content="%%MARKETS_BLURB%%">
    <meta name="keywords"
        content="%%KEYWORDS%%">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ai20.city/locations.html">
    <meta property="og:title" content="AI Agency locations & Markets | ai20">
    <meta property="og:description"
        content="%%MARKETS_BLURB%%">
    <meta property="og:image" content="https://ai20.city/assets/og-locations.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ai20.city/locations.html">
    <meta property="twitter:title" content="AI Agency locations & Markets | ai20">
    <meta property="twitter:description"
        content="%%MARKETS_BLURB%%">
    <meta property="twitter:image" content="https://ai20.city/assets/og-locations.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="https://ai20.city/locations.html">

    <!-- Geo Tags -->
    <meta name="geo.region" content="%%GEO_REGION%%">
    <meta name="geo.placename" content="%%GEO_PLACENAME%%">
    <meta name="geo.position" content="%%GEO_LAT%%;%%GEO_LNG%%">
    <meta name="ICBM" content="%%GEO_LAT%%, %%GEO_LNG%%">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "ai20 Locations",
      "description": "Directory of ai20 AI implementation hubs across %%REGION_LABEL%%.",
      "hasPart": %%LOCATIONS_SCHEMA%%
    }
    </script>
</head>

<body class="bg-alabaster text-obsidian overflow-x-hidden min-h-screen flex flex-col">
    <div id="header-placeholder"></div>

    <main class="flex-grow pt-32 pb-20 px-6 md:px-12 max-w-[1400px] mx-auto w-full">
        <h1 class="font-serif-display text-6xl md:text-8xl italic mb-12">%%MARKETS_HEADLINE%%</h1>
        <p class="font-sans-tech text-sm leading-relaxed max-w-xl mb-16 opacity-70">
            Strategic presence in key innovation hubs across the continent. We ensure compliance with local regulations
            while delivering global-tier AI capabilities.
        </p>

        <!-- Locations Grid and Map Placeholder -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
            <!-- List -->
            <div class="grid grid-cols-2 gap-y-8 gap-x-8 font-sans-tech text-sm tracking-widest max-h-[600px] overflow-y-auto pr-4 custom-scrollbar"
                id="locations-grid">
                <!-- Dynamic Content -->
            </div>

            <!-- Map Visualization (Styled SVG) -->
            <div
                class="relative h-[400px] lg:h-auto border border-[#050505]/10 bg-[#eae7df] p-8 flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 opacity-20"
                    style="background-image: radial-gradient(#050505 1px, transparent 1px); background-size: 20px 20px;">
                </div>
                <span class="font-serif-display text-4xl italic opacity-30">%%COVERAGE_LINE%%</span>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/src/js/locations.js"></script>
</body>

</html>
