<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>AI Offers & Automation Catalog | ai20 %%REGION_LABEL%%</title>
    <meta name="title" content="AI Offers & Automation Catalog | ai20 %%REGION_LABEL%%">
    <meta name="description"
        content="Explore our catalog of 20+ ready-to-deploy AI solutions. From AI Receptionists and SDRs to Legal, Healthcare, and Finance automation.">
    <meta name="keywords" content="%%KEYWORDS%%">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ai20.city/offers.html">
    <meta property="og:locale" content="%%LOCALE%%">
    <meta property="og:title" content="AI Offers & Automation Catalog | ai20 %%REGION_LABEL%%">
    <meta property="og:description"
        content="Explore our catalog of 20+ ready-to-deploy AI solutions. From AI Receptionists and SDRs to Legal, Healthcare, and Finance automation.">
    <meta property="og:image" content="https://ai20.city/assets/og-services.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ai20.city/offers.html">
    <meta property="twitter:title" content="AI Offers & Automation Catalog | ai20 %%REGION_LABEL%%">
    <meta property="twitter:description"
        content="Explore our catalog of 20+ ready-to-deploy AI solutions. From AI Receptionists and SDRs to Legal, Healthcare, and Finance automation.">
    <meta property="twitter:image" content="https://ai20.city/assets/og-services.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="https://ai20.city/offers.html">

    <!-- Geo Tags -->
    <meta name="geo.region" content="%%GEO_REGION%%">
    <meta name="geo.placename" content="%%GEO_PLACENAME%%">
    <meta name="geo.position" content="%%GEO_LAT%%;%%GEO_LNG%%">
    <meta name="ICBM" content="%%GEO_LAT%%, %%GEO_LNG%%">
</head>

<body class="bg-alabaster text-obsidian overflow-x-hidden min-h-screen flex flex-col">
    <!-- Header Injection -->
    <div id="header-placeholder"></div>

    <main class="flex-grow pt-32 pb-20 px-6 md:px-12 max-w-[1400px] mx-auto w-full">
        <!-- Cross-Link Banner -->
        <div
            class="mb-20 bg-[#f4f1ea] border border-[#050505]/10 p-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h3 class="font-serif-display text-2xl italic mb-2">Need a Custom Strategic Roadmap?</h3>
                <p class="font-sans-tech text-sm opacity-70">Looking for high-level consulting or a Fractional CAIO
                    instead of specific tools?</p>
            </div>
            <a href="services.html"
                class="px-6 py-3 bg-[#050505] text-[#f4f1ea] font-sans-tech text-xs uppercase tracking-widest hover:bg-[#ff3300] transition-colors whitespace-nowrap">
                View Strategic Services
            </a>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-8">
            <div>
                <h1 class="font-serif-display text-4xl md:text-5xl italic mb-4">Current AI Offers</h1>
                <p class="font-sans-tech text-sm opacity-60 max-w-md">Productized, ready-to-deploy AI solutions for
                    immediate impact.</p>
            </div>

            <div class="flex flex-wrap gap-4" id="service-filters">
                <button
                    class="px-4 py-2 border border-[#050505] bg-[#050505] text-[#f4f1ea] text-xs uppercase tracking-widest transition-colors"
                    data-filter="All">All</button>
                <button
                    class="px-4 py-2 border border-[#050505] text-xs uppercase tracking-widest hover:bg-[#050505] hover:text-[#f4f1ea] transition-colors"
                    data-filter="Administrative & Operations">Administrative</button>
                <button
                    class="px-4 py-2 border border-[#050505] text-xs uppercase tracking-widest hover:bg-[#050505] hover:text-[#f4f1ea] transition-colors"
                    data-filter="Sales & Marketing">Sales & Marketing</button>
                <button
                    class="px-4 py-2 border border-[#050505] text-xs uppercase tracking-widest hover:bg-[#050505] hover:text-[#f4f1ea] transition-colors"
                    data-filter="Customer Service">Customer Service</button>
                <button
                    class="px-4 py-2 border border-[#050505] text-xs uppercase tracking-widest hover:bg-[#050505] hover:text-[#f4f1ea] transition-colors"
                    data-filter="Finance & Accounting">Finance</button>
            </div>
        </div>

        <!-- Services Grid -->
        <div id="services-grid" data-ssr="true" class="grid grid-cols-1 gap-8">
            %%OFFER_GRID%%
        </div>
    </main>

    <!-- Footer Injection -->
    <div id="footer-placeholder"></div>
    <script type="module" src="./src/js/services.js"></script>
</body>

</html>
