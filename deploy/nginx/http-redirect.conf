# deploy/nginx/http-redirect.conf
#
# Fixes SEO-AUDIT.md P0 #2: HTTP currently serves 200 on every host, so the
# whole site is duplicated on http:// and https://, and it silently defeats
# the HSTS header the apex already sends.
#
# Install: copy this file's content into its own server block (or append to
# an existing catch-all :80 block) in the nginx config, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ai20.city www.ai20.city eu.ai20.city us.ai20.city;
    return 301 https://$host$request_uri;
}
