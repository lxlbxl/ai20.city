# deploy/nginx/us.conf — us.ai20.city
#
# CERT PATH: see the note in apex.conf — one cert already covers all four
# hostnames. Copy ssl_certificate/ssl_certificate_key from the working apex
# vhost rather than retyping.
#
# PHP-FPM SOCKET: run deploy/find-php-fpm-socket.sh on the server once and
# use whatever it reports as already working. The line below is a common
# default, not a guarantee for this specific box.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name us.ai20.city;

    ssl_certificate     /etc/letsencrypt/live/ai20.city/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai20.city/privkey.pem;

    root /var/www/ai20-us;
    index index.html;

    # Retired Tier C pages (city x niche x offer, removed - see git history)
    # are indexed, so redirect rather than 404. Must come before location /.
    location ~ ^/locations/([^/]+)/([^/]+)/(?!index\.html$)[^/]+\.html$ {
        return 301 /locations/$1/$2/;
    }

    # Directory-style local pages (/locations/austin/hvac/) need $uri/
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /backend/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # verify - see deploy/find-php-fpm-socket.sh
    }
}
