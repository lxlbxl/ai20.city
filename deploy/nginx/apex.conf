# deploy/nginx/apex.conf — ai20.city / www.ai20.city
#
# Serves ONLY the neutral region chooser (dist/region-select.html, published
# to /var/www/ai20-apex/index.html by deploy/deploy.sh). Self-contained page:
# no CSS/JS asset dependencies, so this block needs nothing but static files.
#
# CERT PATH: the live certificate already covers all four hostnames in one
# Let's Encrypt lineage (verified via `openssl s_client` against ai20.city:443
# — SANs: ai20.city, www.ai20.city, eu.ai20.city, us.ai20.city). Copy the
# ssl_certificate / ssl_certificate_key lines EXACTLY as they appear in the
# current working apex vhost rather than retyping them — the path below is
# certbot's default naming convention and is very likely correct, but the
# existing config is the source of truth. Confirm with:
#   sudo certbot certificates

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai20.city www.ai20.city;

    ssl_certificate     /etc/letsencrypt/live/ai20.city/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai20.city/privkey.pem;

    root /var/www/ai20-apex;
    index index.html;

    location / {
        try_files /index.html =404;   # always the chooser, no other routes
    }
}
